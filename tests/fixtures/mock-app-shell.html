<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Mock App Shell — NightWatch test fixture</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; color: #222; }
    /* The whole site lives in one fixed, scrolling container, as some web apps do. */
    #shell { position: fixed; inset: 0; overflow: auto; background: #fafafa; }
    header { padding: 18px 32px; background: #fff; font-weight: 700; display: flex; justify-content: space-between; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 24px 32px; }
    .grid div { background: #fff; border-radius: 10px; height: 240px; padding: 12px; }

    #club-mask { display: none; position: fixed; inset: 0; z-index: 10; background: rgba(15, 23, 42, 0.6); }
    #club { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 11;
      width: 440px; padding: 32px; box-sizing: border-box; background: #fff; border-radius: 16px; text-align: center; }
    #club-mask.open, #club.open { display: block; }
    #club .join { display: block; width: 100%; height: 50px; border: 0; border-radius: 10px; margin: 18px 0 10px;
      background: #7c3aed; color: #fff; font-size: 17px; font-weight: 600; }
    #club .skip { font-size: 11px; color: #c4c4c4; background: none; border: 0; }
  </style>
</head>
<body>
  <!--
    Expected (Layer 2): Pop-up Interruption (exactly one), Biased Buttons.
  -->
  <div id="shell">
    <header><span>Lumen Home</span><span>Cart (0)</span></header>
    <div class="grid">
      <div>Linen throw — $59.00</div>
      <div>Stoneware mug — $18.00</div>
      <div>Oak serving board — $42.00</div>
      <div>Wool blanket — $129.00</div>
      <div>Glass carafe — $34.00</div>
      <div>Cotton napkins — $22.00</div>
    </div>

    <div id="club-mask"></div>
    <div id="club">
      <h2>Join the Lumen club</h2>
      <p>Members-only prices and early access to new collections.</p>
      <button class="join">Join now</button>
      <button class="skip">No thanks</button>
    </div>
  </div>

  <script>
    setTimeout(() => {
      document.getElementById("club-mask").classList.add("open");
      document.getElementById("club").classList.add("open");
    }, 1500);
  </script>
</body>
</html>
